schema_version = "1.4"

[task]
name = "companmem/three-month-reunion"
version = "0.1.0"
description = "Opening after a three-month silence treats the gap as months"

[metadata]
hole = 10
category = "companion-memory"

[verifier]
timeout_sec = 60.0
environment_mode = "separate"

[agent]
timeout_sec = 180.0

[environment]
network_mode = "no-network"
os = "linux"

artifacts = ["/logs/artifacts/reply.txt", "/logs/artifacts/memory_export.json"]
