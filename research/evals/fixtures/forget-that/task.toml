schema_version = "1.4"

[task]
name = "companmem/forget-that"
version = "0.1.0"
description = "User revokes a fact; next turn must not use it"

[metadata]
hole = 9
category = "companion-memory"

[verifier]
timeout_sec = 60.0
environment_mode = "separate"

[agent]
timeout_sec = 180.0

[environment]
network_mode = "no-network"
os = "linux"

artifacts = ["/logs/artifacts/reply.txt", "/logs/artifacts/memory_export.json"]
