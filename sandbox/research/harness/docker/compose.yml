services:
  agent:
    build:
      context: ../../..
      dockerfile: research/harness/docker/Dockerfile.agent
    network_mode: none
    volumes:
      - ${TRIAL_DIR}/world:/work/world:ro
      - ${TRIAL_DIR}/artifacts:/work/artifacts
    working_dir: /work

  verifier:
    build:
      context: ../../..
      dockerfile: research/harness/docker/Dockerfile.verifier
    network_mode: none
    volumes:
      - ${TRIAL_DIR}/artifacts:/work/artifacts:ro
      - ${TRIAL_DIR}/predicates.json:/predicates.json:ro
      - ${TRIAL_DIR}/out:/work/out
    working_dir: /work
