# Root-level pytest configuration for the harness test suite.
# This file exists solely to scope pytest discovery when running from the repo root.
# The harness package build config lives in harness/pyproject.toml.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers --disable-socket --allow-unix-socket"

[tool.coverage.run]
branch = true
source = ["harness"]
