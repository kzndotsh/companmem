[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picon-eval"
version = "0.1.0"
description = "Persona Interview & Consistency Evaluation Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "PICON Team"},
]
keywords = ["llm", "persona", "evaluation", "interview", "consistency", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.40",
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv",
    "beautifulsoup4",
    "markdownify",
    "pdfplumber",
    "requests",
    "rank-bm25",
    "nest-asyncio",
    "cloudscraper",
    "boto3",                       
    "google-cloud-aiplatform",     
    "anthropic[vertex]",           
]

[project.scripts]
picon = "picon.__main__:main"

[project.optional-dependencies]
all = ["pycharacterai", "google-genai", "PyGithub", "redis"]

[project.urls]
Homepage = "https://github.com/willystumblr/picon"
Repository = "https://github.com/willystumblr/picon"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["picon*"]

[tool.setuptools.package-data]
"picon.agents.prompts" = ["*.txt"]
"picon.env" = ["*.json", "*.txt"]
