[project]
name = "persona-crucible"
version = "0.1.1"
description = "A benchmark for the stability of LLM personas under social pressure"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "aishwaryawambule" }]
keywords = ["llm", "benchmark", "persona", "sycophancy", "evaluation", "ai-safety"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.6", "httpx>=0.27", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/aishwaryawambule/persona-crucible"
Repository = "https://github.com/aishwaryawambule/persona-crucible"
Dashboard = "https://aishwaryawambule.github.io/persona-crucible/"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11",
       "types-PyYAML>=6.0"]

[project.scripts]
crucible = "crucible.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "E501",   # long single-line prompt/guidance strings are clearer unwrapped
    "UP042",  # (str, Enum) is intentional — plays nicely with pydantic serialization
]

[tool.ruff.lint.per-file-ignores]
# Tests use compact one-line fakes (semicolons) and short throwaway names.
"tests/*" = ["E701", "E702", "E741"]

[tool.mypy]
files = ["crucible"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.setuptools.packages.find]
where = ["."]
include = ["crucible*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
